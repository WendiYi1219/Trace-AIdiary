<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>icon</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #fff;
      }
      body {
        display: grid;
        place-items: center;
      }
      .sun-stage {
        width: 260px;
        height: 260px;
        position: relative;
      }
      .input-wrap {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .input-sun {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* 眼睛/高光覆盖层：与产品页同源素材 */
      .sun-overlay {
        position: absolute;
        width: 74%;
        height: 74%;
        top: 10%;
        left: 18%;
        object-fit: contain;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="sun-stage">
      <div class="input-wrap input-wrap--sun-active" aria-hidden="true">
        <canvas class="input-sun" width="200" height="200" aria-hidden="true"></canvas>
        <img class="sun-overlay" src="assets/frame-121.svg" alt="" aria-hidden="true" />
      </div>
    </div>
    <script src="./sun-canvas.js"></script>
  </body>
</html>
